<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Ticket Submitted</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow mx-auto text-center" style="max-width: 600px;">
        <div class="card-body p-5">
            <h2 class="text-success">Ticket Submitted Successfully!</h2>
            <p class="mt-3">Your support request has been received.</p>
            <p>Ticket Request ID: <strong>{{ ticket_ref }}</strong></p>
            <a href="{% url 'supportdesk:ticket_create' %}" class="btn btn-primary mt-3">
                Submit Another Ticket
            </a>
        </div>
    </div>
</div>
<footer class="text-center text-muted mt-4">
    Current Request ID: {{ request.audit_id }}
</footer>
</body>
</html>
